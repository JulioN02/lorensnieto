# ============================================
# REUSABLE RESPONSES
# ============================================
components:
  responses:
    Unauthorized:
      description: No autenticado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error: "No autenticado"
    Forbidden:
      description: No autorizado — se requiere rol admin
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error: "Acceso denegado"
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error: "Recurso no encontrado"
            code: "NOT_FOUND"
