<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Detalle de servicio — Lorens Nieto" />
  <title>Cargando... — Lorens Nieto</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/api.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <div id="header"></div>

  <a href="https://wa.me/573001234567?text=Hola%2C%20quiero%20informaci%C3%B3n" target="_blank" rel="noopener" class="whatsapp-float" aria-label="WhatsApp">
    💬
  </a>

  <main class="main-content">
    <div class="container" style="padding-top:2rem;padding-bottom:2rem;">
      <!-- Loading -->
      <div id="loadingState" class="loading-spinner">
        <div class="spinner"></div>
        <p>Cargando servicio...</p>
      </div>

      <!-- Error -->
      <div id="errorState" class="error-state" style="display:none;">
        <div class="error-state-icon">⚠️</div>
        <h3>Servicio no encontrado</h3>
        <p id="errorMessage">El servicio que buscas no existe o ha sido removido.</p>
        <a href="servicios.html" class="btn btn-primary mt-2">Ver todos los servicios</a>
      </div>

      <!-- Content -->
      <div id="content" style="display:none;">
        <div class="breadcrumb">
          <a href="index.html">Inicio</a>
          <span class="separator">/</span>
          <a href="servicios.html">Servicios</a>
          <span class="separator">/</span>
          <span id="breadcrumbName"></span>
        </div>

        <!-- Gallery -->
        <div class="detail-gallery">
          <img id="gallery-main" class="detail-main-img" src="" alt="" />
          <div id="gallery-thumbs" class="detail-thumbs"></div>
        </div>

        <div class="detail-info">
          <div>
            <!-- Header -->
            <div class="detail-header">
              <div>
                <h1 id="serviceName"></h1>
                <span id="serviceBadge" class="classification-badge"></span>
              </div>
              <div class="price-accent" id="servicePrice"></div>
            </div>

            <div class="detail-meta-row">
              <div class="detail-meta-item">📋 Tipo: <strong id="serviceType"></strong></div>
            </div>

            <!-- Description -->
            <div class="detail-section">
              <h3>Descripción</h3>
              <p id="serviceDescription" class="detail-description"></p>
            </div>
          </div>

          <div>
            <!-- Rules -->
            <div class="detail-section">
              <h3>Reglas</h3>
              <ol id="serviceRules" class="detail-rules"></ol>
            </div>

            <!-- Actions -->
            <div class="detail-actions">
              <button class="btn btn-primary btn-lg" id="btnRequestInfo">📋 Solicitar Información</button>
              <a href="https://wa.me/573001234567" target="_blank" rel="noopener" class="btn btn-whatsapp btn-lg">💬 Contactar por WhatsApp</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');

      if (!id) {
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('errorState').style.display = 'block';
        document.getElementById('errorMessage').textContent = 'No se especificó un servicio.';
        return;
      }

      const $ = (sel) => document.getElementById(sel);

      const classMap = {
        alimentacion: 'alimentacion',
        limpieza: 'limpieza',
        otros: 'otros',
      };

      const classificationLabel = {
        alimentacion: 'Alimentación',
        limpieza: 'Limpieza',
        otros: 'Otros',
      };

      async function loadService() {
        try {
          const res = await API.getService(id);

          if (!res.success || !res.data) {
            throw new Error(res.error || 'Servicio no encontrado');
          }

          const s = res.data;

          // Update page title
          document.title = `${s.name} — Lorens Nieto`;

          // Breadcrumb
          $('breadcrumbName').textContent = s.name;

          // Name & badge
          $('serviceName').textContent = s.name;
          const badge = $('serviceBadge');
          badge.textContent = classificationLabel[s.classification] || s.classification;
          badge.className = `classification-badge ${classMap[s.classification] || 'otros'}`;

          // Price
          $('servicePrice').textContent = API.formatPrice(Number(s.price));

          // Type
          $('serviceType').textContent = s.type || '—';

          // Description
          $('serviceDescription').textContent = s.description;

          // Rules
          const rulesContainer = $('serviceRules');
          if (s.rules && s.rules.length > 0) {
            rulesContainer.innerHTML = s.rules.map((r) => `<li>${escapeHtml(r)}</li>`).join('');
          } else {
            rulesContainer.innerHTML = '<li class="text-muted">No se especificaron reglas.</li>';
          }

          // Gallery
          const mainImg = $('gallery-main');
          const thumbsContainer = $('gallery-thumbs');

          if (s.media && s.media.length > 0) {
            const images = s.media.filter((m) => m.mediaType === 'img');
            if (images.length > 0) {
              const firstImg = images[0].url;
              mainImg.src = firstImg;
              mainImg.alt = s.name;
              mainImg.onerror = function () {
                this.src = 'https://placehold.co/800x500/1e3a5f/c9a84c?text=Sin+Imagen';
              };

              thumbsContainer.innerHTML = images
                .map(
                  (img, idx) =>
                    `<img src="${img.url}" alt="${escapeHtml(s.name)} - Foto ${idx + 1}" class="detail-thumb ${idx === 0 ? 'active' : ''}" data-full="${img.url}" loading="lazy" onerror="this.src='https://placehold.co/80x60/1e3a5f/c9a84c?text=N/A'" />`
                )
                .join('');

              initGallery();
            } else {
              mainImg.src = 'https://placehold.co/800x500/1e3a5f/c9a84c?text=Sin+Imagen';
              mainImg.alt = s.name;
            }
          } else {
            mainImg.src = 'https://placehold.co/800x500/1e3a5f/c9a84c?text=Sin+Imagen';
            mainImg.alt = s.name;
          }

          // Request info button
          $('btnRequestInfo').addEventListener('click', () => {
            openLeadForm({
              serviceId: s.id,
              serviceName: s.name,
              title: 'Solicitar Información',
            });
          });

          // WhatsApp link with service context
          const waBtn = document.querySelector('.detail-actions .btn-whatsapp');
          if (waBtn) {
            waBtn.href = `https://wa.me/573001234567?text=Hola%2C%20quiero%20informaci%C3%B3n%20sobre%20${encodeURIComponent(s.name)}`;
          }

          // Show content
          $('loadingState').style.display = 'none';
          $('content').style.display = 'block';
        } catch (err) {
          $('loadingState').style.display = 'none';
          $('errorState').style.display = 'block';
          $('errorMessage').textContent = err.message || 'El servicio no se pudo cargar.';
        }
      }

      loadService();
    });
  </script>
</body>
</html>
